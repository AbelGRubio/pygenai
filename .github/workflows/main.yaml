name: Master Pipeline (Proyecto Principal)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  pre-commit:
    if: "!contains(github.event.head_commit.message, 'chore(release)')"
    uses: AbelGRubio/github-actions-templates/.github/workflows/pre-commit.yml@v0.0.1

  test:
    needs: pre-commit
    uses: AbelGRubio/github-actions-templates/.github/workflows/test.yml@v0.0.1
    secrets:
      PR_TOKEN_USER: ${{ secrets.PR_TOKEN }}

  sonar:
    needs: test
    uses: AbelGRubio/github-actions-templates/.github/workflows/sonar.yml@v0.0.1
    secrets:
      PR_TOKEN_USER: ${{ secrets.PR_TOKEN }}

  approve-release:
    needs: test
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - run: echo "Release approved by user"

  release:
    needs: approve-release
    permissions:
      contents: write
      packages: write
    uses: AbelGRubio/github-actions-templates/.github/workflows/semantic-release.yml@v0.0.1
    secrets:
      R_TOKEN_USER: ${{ secrets.PR_TOKEN }}

