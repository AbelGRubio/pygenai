[project]
name = "pygenai-core"
version = "0.1.0"
description = "Core library for pygenai, providing foundational utilities and shared components for LLM, memory, and RAG modules."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "litellm>=1.89.3",
    "langchain-core>=1.6.6",
    "starlette>=1.8.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0"
]

[project.scripts]
pygenai = "pygenai.core.cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pygenai"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
