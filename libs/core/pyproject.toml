[project]
name = "pygenai-core"
version = "0.1.0"
description = "Core library for pygenai, providing foundational utilities and shared components for LLM, memory, and RAG modules."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "litellm>=1.89.3",
    "langchain-core>=1.6.6",
    "starlette>=1.8.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/pygenai/core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
