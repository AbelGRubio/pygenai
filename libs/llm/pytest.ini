[pytest]
testpaths = tests
asyncio_mode = auto
addopts =
    --strict-markers
    --tb=short
    -ra
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    integration: marks tests as integration tests
    slow: marks tests as slow
python_files = test_*.py
python_classes = Test*
python_functions = test_*
