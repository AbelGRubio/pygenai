[project]
name = "pygenai-vectorstore"
version = "0.1.0"
description = "Vendored vector store library for pygenai"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pygenai-core",
    "langchain-core>=1.6.6",
    "langchain-openai>=0.3.33",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pygenai/vectorstore"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
