[project]
name = "pygenai-rag"
version = "0.1.0"
description = "Vendored rag library for pygenai"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pygenai-core",
    "pygenai-vectorstore",
    "boto3==1.43.95",
    "botocore==1.43.95",
    "langchain-core>=1.6.6",
    "langchain-openai>=0.3.33",
    "numpy>=2.5.3",
    "pymongo>=4.18.2",
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pygenai/rag"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
