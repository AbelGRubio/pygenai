[project]
name = "pygenai-cli"
version = "0.1.0"
description = "CLI for pygenai."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic-settings>=2.16.3",
    "typer>=0.9.0",
    "pygenai-core"
]

[project.scripts]
pygenai = "pygenai.cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pygenai"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
