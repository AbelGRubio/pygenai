[project]
name = "pygenai-agent"
version = "0.1.0"
description = "Agent framework for building autonomous agents with LiteLLM and LangChain integration"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pygenai-core",
    "langgraph-api",
    "langchain>=0.1.0",
    "langchain-litellm>=0.7.1",
    "litellm>=1.89.3",
    "langchain-core>=1.6.6"
]

[tool.hatch.build.targets.wheel]
packages = ["src/pygenai/agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
